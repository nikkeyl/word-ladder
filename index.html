  </style>
  <style>
    :root {
      --paper: #eeeae3;
      --stock: #fcf8ef;
      --ink: #202b57;
      --blue: #303e7a;
      --blue-dark: #232e5f;
      --control-fill: #40518d;
      --control-hover: #4b5d9b;
      --red: #fc8b69;
      --red-ink: #962e26;
      --goal-fill: #c7eeac;
      --motion-duration: 300ms;
      --motion-easing: ease-in-out;
      --slab: 'Roboto Slab Variable', 'Hiragino Mincho ProN', 'Yu Mincho', Georgia, serif;
    }
    body {
      background: var(--paper);
      color: var(--ink);
      font-family: system-ui, sans-serif;
    }
    ::selection { background: var(--red); color: var(--ink); }
    :focus-visible { outline: 2px solid #384b9a; outline-offset: 4px; }
    [hidden] { display: none !important; }
    .shell {
      width: min(38rem, calc(100% - 2rem));
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      align-content: center;
      gap: clamp(1.25rem, 4vw, 2rem);
    }
    .title {
      font-family: var(--slab);
      font-size: clamp(2.4rem, 8vw, 5.3rem);
      font-weight: 900;
      letter-spacing: -.04em;
      line-height: .99;
      text-align: center;
    }
    .title-accent { color: var(--red-ink); }
    .board, .setup {
      background: var(--blue);
      color: var(--stock);
      border-radius: .85rem;
      padding: clamp(1rem, 3.3vw, 2rem);
      min-width: 0;
    }
    .board :focus-visible, .setup :focus-visible { outline-color: var(--red); }
    .section-title { font-family: var(--slab); font-weight: 800; }
    .setup .label { color: #e2e8ff; }
    .tiles {
      grid-template-columns: repeat(auto-fit, minmax(min(3rem, 100%), 1fr));
      max-width: calc(var(--letters) * 11rem);
      margin-inline: auto;
    }
    .tile {
      --tile-depth: .25rem;
      --tile-edge: #bba786;
      --tile-light: #ffffffa8;
      display: grid;
      place-items: center;
      position: relative;
      container-type: inline-size;
      background: var(--stock);
      color: var(--ink);
      border-radius: .3rem;
      box-shadow: inset 0 1px 0 var(--tile-light),
        0 var(--tile-depth) 0 var(--tile-edge), 0 .48rem .65rem -.17rem #101831a6;
      font-family: var(--slab);
      font-weight: 850;
      line-height: 1;
      min-height: 2.75rem;
      aspect-ratio: 1.09;
    }
    .tile span { font-size: clamp(1.35rem, 53cqi, 4.7rem); }
    .tile.changed {
      --tile-edge: #bd8c74;
      background: #f9dfd0;
    }
    .tile.locked {
      --tile-edge: #151d3b;
      --tile-light: #8495cb61;
      background: var(--ink);
      color: var(--stock);
    }
    .tile.locked::after {
      position: absolute;
      inset: .39rem .38rem auto auto;
      width: .46rem;
      height: .26rem;
      border: solid #ffb399;
      border-width: 0 0 2px 2px;
      transform: rotate(-45deg);
      content: '';
    }
    .tile:enabled { cursor: pointer; }
    .tile:hover:enabled[aria-pressed="false"] { background: #fff1de; }
    .tile:enabled:active {
      --tile-depth: .12rem;
      transform: translateY(.13rem);
    }
    .tile[aria-pressed="true"] {
      --tile-edge: #b95e46;
      background: var(--red);
    }
    .target-glyph {
      --tile-edge: #809c66;
      background: var(--goal-fill);
    }
    .label { font-size: .8125rem; font-weight: 700; }
    .letter-input {
      position: absolute;
      inset: 0 auto auto 0;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
    }
    .notice { min-height: 2.5rem; color: #ecf0ff; }
    .notice.error, .setup-error { color: #ffd2c4; }
    .setup-caption { color: #e0e6ff; }
    .setup-field {
      width: 100%;
      min-height: 2.75rem;
      padding: .4rem .65rem;
      border-radius: .3rem;
      background: var(--stock);
      color: var(--ink);
    }
    .select-shell {
      position: relative;
    }
    .setup-select::after {
      position: absolute;
      inset: 50% .9rem auto auto;
      width: .47rem;
      height: .47rem;
      border: solid var(--ink);
      border-width: 0 2px 2px 0;
      transform: translateY(-70%) rotate(45deg);
      pointer-events: none;
      content: '';
    }
    .setup-select {
      position: relative;
      padding-inline-end: 1.9rem;
      text-align: start;
      cursor: pointer;
    }
    .setup-select[aria-expanded="true"]::after {
      transform: translateY(-25%) rotate(225deg);
    }
    .select-menu {
      --menu-shift: -.35rem;
      position: absolute;
      z-index: 10;
      inset: calc(100% + .35rem) 0 auto;
      padding: .2rem;
      overflow: auto;
      border-radius: .35rem;
      background: var(--stock);
      box-shadow: 0 .35rem 1rem #1b234b45;
      color: var(--ink);
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transform: translateY(var(--menu-shift));
    }
    .select-menu.opens-up {
      --menu-shift: .35rem;
      inset: auto 0 calc(100% + .35rem);
    }
    .select-menu[aria-hidden="false"] {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
      transform: translateY(0);
    }
    .select-option {
      display: flex;
      align-items: center;
      min-height: 2.75rem;
      gap: .25rem;
      padding: .4rem .4rem;
      border-radius: .2rem;
      font-size: .9rem;
      overflow-wrap: anywhere;
      cursor: pointer;
    }
    .select-option[aria-selected="true"] { background: #f9dfd0; }
    .select-option[data-active="true"] {
      background: var(--blue);
      color: var(--stock);
    }
    .select-option:not([data-active="true"]):hover { background: #efe5db; }
    .select-option[aria-selected="true"]::after {
      flex: 0 0 .5rem;
      height: .3rem;
      margin-inline-start: auto;
      border: solid currentColor;
      border-width: 0 0 2px 2px;
      transform: rotate(-45deg);
      content: '';
    }
    .start-button {
      color: var(--ink);
      background: var(--red);
      border-radius: .3rem;
    }
    .start-button:hover { background: #ffae91; }
    .control {
      min-height: 2.75rem;
      border-radius: .3rem;
      background: var(--control-fill);
      padding: .4rem .8rem;
      font-size: .875rem;
      font-weight: 700;
    }
    .control:hover { background: var(--control-hover); }
    .control:has(input:checked) {
      color: var(--ink);
      background: var(--stock);
    }
    .control:has(input:focus-visible) {
      outline: 2px solid var(--red);
      outline-offset: 2px;
    }
    .board-action {
      min-height: 2.75rem;
      padding: 0 .65rem;
      border-radius: .3rem;
      background: var(--control-fill);
    }
    .board-action:hover:enabled { background: var(--control-hover); }
    .unavailable-game {
      inline-size: 100%;
      max-inline-size: 22rem;
      justify-self: center;
    }
    .online-status {
      min-height: 1.75rem;
      color: #e2e8ff;
      overflow-wrap: anywhere;
    }
    .online-status[data-own-turn="true"] { color: var(--goal-fill); }
    .invite-tools { position: relative; }
    .invite-field { padding-inline-end: 3rem; }
    .invite-copy {
      position: absolute;
      inset: 0 .2rem 0 auto;
      display: grid;
      place-items: center;
      width: 2.75rem;
      min-height: 2.75rem;
      border-radius: .3rem;
      color: var(--ink);
      cursor: pointer;
    }
    .invite-copy:hover { background: #202b5710; }
    .start-button:disabled, .board-action:disabled { opacity: .65; }

    .tile, .control, .setup-field, .start-button, .select-option,
    .board-action, .invite-copy, .notice {
      transition-property: background-color, color, opacity, transform;
      transition-duration: var(--motion-duration);
      transition-timing-function: var(--motion-easing);
    }
    .tile { transition-property: background-color, color, opacity, transform, box-shadow; }
    .setup-select::after {
      transition: transform var(--motion-duration) var(--motion-easing);
    }
    .select-menu {
      transition-property: opacity, transform, visibility;
      transition-duration: var(--motion-duration);
      transition-timing-function: var(--motion-easing);
    }
    .title, .setup, .board, .setup-error, #script-field, #host-name-field {
      animation: reveal-print var(--motion-duration) var(--motion-easing);
    }
    .tile.changed span {
      animation: impression var(--motion-duration) var(--motion-easing);
    }
    @keyframes reveal-print {
      from { opacity: .8; transform: translateY(.22rem); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes impression {
      from { transform: translateY(-.16em); }
      to { transform: translateY(0); }
    }
    @media (prefers-reduced-motion: reduce) {
      :root { --motion-duration: 0ms; }
    }

<body>
  <main class="shell mx-auto py-6 sm:py-10">
    <h1 class="title" lang="en">Word <span class="title-accent">Ladder</span></h1>

    <form id="setup" class="setup" aria-labelledby="setup-heading" novalidate>
      <h2 id="setup-heading" data-i18n="settings"
        class="section-title mb-4 text-center text-2xl">Настройка партии</h2>
      <fieldset class="mb-4 grid grid-cols-3 gap-2">
        <legend data-i18n="mode" class="label mb-1">Режим игры</legend>
        <label class="control inline-flex cursor-pointer items-center justify-center text-center">
          <input class="sr-only" type="radio" name="mode" value="duo" checked>
          <span data-i18n="duo">Вдвоём</span>
        </label>
        <label class="control inline-flex cursor-pointer items-center justify-center text-center">
          <input class="sr-only" type="radio" name="mode" value="bot">
          <span data-i18n="bot">Против бота</span>
        </label>
        <label class="control inline-flex cursor-pointer items-center justify-center text-center">
          <input class="sr-only" type="radio" name="mode" value="online">
          <span data-i18n="online">По ссылке</span>
        </label>
      </fieldset>
      <div class="grid grid-cols-2 gap-3">
        <label id="host-name-field" class="col-span-2 min-w-0" hidden>
          <span data-i18n="name" class="label mb-1 block">Имя</span>
          <input id="host-name" class="setup-field" type="text" autocomplete="nickname"
            maxlength="40" aria-describedby="setup-error">
        </label>
        <div id="language-field" class="col-span-2 min-w-0">
          <span id="language-label" data-i18n="language" class="label mb-1 block">Язык игры</span>
          <div class="select-shell">
            <input id="language" type="hidden" value="ru">
            <button class="setup-field setup-select" type="button" role="combobox"
              aria-labelledby="language-label" aria-expanded="false"
              aria-controls="language-options">Русский</button>
            <div id="language-options" class="select-menu" role="listbox"
              aria-labelledby="language-label" aria-hidden="true">
              <div id="language-ru" class="select-option" role="option"
                aria-selected="true" data-value="ru">Русский</div>
                <div id="language-en" class="select-option" role="option"
                  aria-selected="false" data-value="en">English</div>
              <div id="language-ja" class="select-option" role="option"
                  aria-selected="false" data-value="ja">日本語</div>
            </div>
          </div>
        </div>
        <div id="script-field" class="min-w-0" hidden>
          <span id="script-title" data-i18n="script" class="label mb-1 block">Азбука</span>
          <div class="select-shell">
            <input id="script" type="hidden" value="hiragana">
            <button class="setup-field setup-select" type="button" role="combobox"
              aria-labelledby="script-title" aria-expanded="false"
              aria-controls="script-options">Хирагана</button>
            <div id="script-options" class="select-menu" role="listbox"
              aria-labelledby="script-title" aria-hidden="true">
              <div id="script-hiragana" class="select-option" role="option"
                  aria-selected="true" data-value="hiragana" data-i18n="hiragana">Хирагана</div>
              <div id="script-katakana" class="select-option" role="option"
                  aria-selected="false" data-value="katakana" data-i18n="katakana">Катакана</div>
            </div>
          </div>
        </div>
        <label class="min-w-0">
          <span data-i18n="startWord" class="label mb-1 block">Начальное слово</span>
          <input id="start-word" class="setup-field" type="text" value="муха"
            autocomplete="off" autocapitalize="off" spellcheck="false"
            aria-describedby="setup-help setup-error">
        </label>
        <label class="min-w-0">
          <span data-i18n="goalWord" class="label mb-1 block">Конечное слово</span>
          <input id="goal-word" class="setup-field" type="text" value="слон"
            autocomplete="off" autocapitalize="off" spellcheck="false"
            aria-describedby="setup-help setup-error">
        </label>
      </div>
      <p id="setup-help" class="setup-caption mt-3 text-sm">
        Два разных слова одинаковой длины, от трёх знаков.
      </p>
      <p id="setup-error" class="setup-error mt-2 text-sm" role="alert" hidden></p>
      <button id="start-button" class="start-button mt-4 min-h-11 w-full cursor-pointer px-4 font-bold"
        type="submit">
        Начать игру
      </button>
    </form>

    <form id="join-form" class="setup" aria-labelledby="join-heading" hidden novalidate>
      <h2 id="join-heading" data-i18n="joinHeading"
        class="section-title mb-4 text-center text-2xl">Вход в игру</h2>
      <label class="block">
        <span data-i18n="name" class="label mb-1 block">Имя</span>
        <input id="guest-name" class="setup-field" type="text" autocomplete="nickname"
          maxlength="40" aria-describedby="join-error">
      </label>
      <p id="join-error" class="setup-error mt-2 text-sm" role="alert" hidden></p>
      <button id="join-button" data-i18n="join"
        class="start-button mt-4 min-h-11 w-full cursor-pointer px-4 font-bold" type="submit">Войти</button>
      <button id="join-back" data-i18n="back"
        class="board-action mt-2 w-full text-sm font-semibold" type="button">Назад</button>
    </form>

    <section id="unavailable-game" class="setup unavailable-game text-center"
      aria-labelledby="unavailable-heading" hidden>
      <h2 id="unavailable-heading" data-i18n="not_found" tabindex="-1"
        class="section-title mb-3 text-xl">Эта партия недоступна.</h2>
      <button id="unavailable-back" data-i18n="back"
        class="board-action w-full text-sm font-semibold" type="button">Назад</button>
    </section>

    <section id="game" class="board relative" hidden data-i18n-label="board" aria-label="Игровое поле">
      <p id="turn" class="sr-only" role="status"></p>
      <p id="online-turn" class="online-status mb-2 text-center text-sm font-bold"
        role="status" hidden></p>
      <div id="tiles" class="tiles grid gap-2 sm:gap-3" role="group"></div>
      <h2 data-i18n="goal" class="section-title my-3 text-center text-lg">Цель</h2>
      <div id="target" class="tiles mb-5 grid gap-2 sm:gap-3" role="img">
      </div>
      <input id="letter" class="letter-input" type="text" tabindex="-1"
        inputmode="text" autocomplete="off" autocapitalize="off"
        spellcheck="false" data-i18n-label="letterLabel" aria-label="Новый знак"
        aria-describedby="notice">
      <p id="notice" class="notice text-center text-sm" aria-live="polite"></p>
      <div id="invite-panel" class="mb-3" hidden>
        <label for="invite-link" data-i18n="invite" class="label mb-1 block">Ссылка для приглашения</label>
        <div class="invite-tools">
          <input id="invite-link" class="setup-field invite-field" type="text" readonly>
          <button id="copy-invite" data-i18n-label="copy" class="invite-copy"
            type="button" aria-label="Скопировать ссылку">
            <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24"
              fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
              stroke-linejoin="round">
              <rect x="8" y="8" width="12" height="12" rx="2"/>
              <path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/>
            </svg>
          </button>
        </div>
      </div>
      <button id="restart" data-i18n="newGame" class="board-action mt-2 w-full text-sm font-semibold"
        type="button">
        Новая игра
      </button>
    </section>
  </main>

    const detectLocale = () => {
      const preferred = (navigator.languages?.length ? navigator.languages : [navigator.language])
        .filter(Boolean).flatMap((tag) => {
          try {
            return [new Intl.Locale(tag)];
          } catch {
            return [];
          }
        });

      const supported = preferred.find((item) => Object.hasOwn(STRINGS, item.language));
      if (supported) return supported.language;

      return preferred.some((item) => item.maximize().script === 'Cyrl') ? 'ru' : 'en';
    };

    let locale = detectLocale();
    const t = (key, values = {}) => {
      const text = STRINGS[locale][key] ?? STRINGS[locale].offline;
      return text.replace(/\{(\w+)\}/g, (_, name) => String(values[name] ?? ''));
    };

    const LANGUAGES = {
      en: {
        goal: 'warm',
        letterError: 'inputPatternEn',
        pattern: WORD_PATTERNS.en,
        start: 'cold',
        wordError: 'setupPatternEn',
      },
      ja: {
        goal: 'ことり',
        letterError: 'inputPatternJa',
        pattern: WORD_PATTERNS.ja,
        start: 'さくら',
        wordError: 'setupPatternJa',
      },
      ru: {
        goal: 'слон',
        letterError: 'inputPatternRu',
        pattern: WORD_PATTERNS.ru,
        start: 'муха',
        wordError: 'setupPatternRu',
      },
    };
    const setup = document.getElementById('setup');
    const setupHelp = document.getElementById('setup-help');
    const setupError = document.getElementById('setup-error');
    const languagePicker = document.getElementById('language');
    const languageField = document.getElementById('language-field');
    const scriptField = document.getElementById('script-field');
    const scriptPicker = document.getElementById('script');
    const startWord = document.getElementById('start-word');
    const goalWord = document.getElementById('goal-word');
    const game = document.getElementById('game');
    const target = document.getElementById('target');
    const input = document.getElementById('letter');
    const restart = document.getElementById('restart');
    const tiles = document.getElementById('tiles');
    const turn = document.getElementById('turn');
    const notice = document.getElementById('notice');

    let round;
    let tileButtons = [];
    let history;
    let used;
    let mode;
    let nextStep;
    let botTimer;
    let selected = null;

    const bindSelect = (field) => {
      const shell = field.parentElement;
      const trigger = shell.querySelector('[role="combobox"]');
      const menu = shell.querySelector('[role="listbox"]');
      const options = [...menu.children];
      let active = 0;
      let expanded = false;

      const highlight = (index) => {
        options[active].removeAttribute('data-active');
        active = Math.max(0, Math.min(index, options.length - 1));
        const option = options[active];
        option.dataset.active = 'true';
        trigger.setAttribute('aria-activedescendant', option.id);

        const offset = option.offsetTop;
        const bottom = offset + option.offsetHeight;
        if (offset < menu.scrollTop) menu.scrollTop = offset;
        if (bottom > menu.scrollTop + menu.clientHeight) {
          menu.scrollTop = bottom - menu.clientHeight;
        }
      };

      const close = () => {
        expanded = false;
        menu.setAttribute('aria-hidden', 'true');
        trigger.setAttribute('aria-expanded', 'false');
        trigger.removeAttribute('aria-activedescendant');
      };

      const open = () => {
        menu.style.maxHeight = '';

        const { top, bottom } = trigger.getBoundingClientRect();
        const viewport = window.visualViewport;
        const viewportTop = viewport?.offsetTop ?? 0;
        const viewportHeight = viewport?.height ?? window.innerHeight;
        const above = top - viewportTop - 12;
        const below = viewportTop + viewportHeight - bottom - 12;
        const opensUp = below < menu.offsetHeight && above > below;
        menu.classList.toggle('opens-up', opensUp);
        menu.style.maxHeight = Math.max(44, opensUp ? above : below) + 'px';
        expanded = true;
        menu.setAttribute('aria-hidden', 'false');
        trigger.setAttribute('aria-expanded', 'true');
        highlight(options.findIndex((option) => option.dataset.value === field.value));
      };

      const choose = (index, notify = true) => {
        const option = options[index];
        close();

        if (field.value === option.dataset.value) return;

        field.value = option.dataset.value;
        trigger.textContent = option.textContent;

        for (const item of options) {
          item.setAttribute('aria-selected', String(item === option));
        }

        if (notify) field.dispatchEvent(new Event('change', { bubbles: true }));
      };

      trigger.addEventListener('pointerdown', (event) => {
        if (expanded) event.preventDefault();
      });
      trigger.addEventListener('click', (event) => {
        if (!expanded) {
          trigger.focus();
          open();
        } else if (event.detail === 0) {
          choose(active);
        } else {
          close();
        }
      });
      trigger.addEventListener('blur', close);
      menu.addEventListener('mousedown', (event) => event.preventDefault());
      menu.addEventListener('click', (event) => {
        const index = options.indexOf(event.target.closest('[role="option"]'));
        if (expanded && index >= 0) choose(index);
      });
      document.addEventListener('pointerdown', (event) => {
        if (expanded && !shell.contains(event.target)) close();
      });

      trigger.addEventListener('keydown', (event) => {
        if (event.isComposing || event.ctrlKey || event.metaKey || event.altKey) return;

        const { key } = event;
        if (key === 'Tab') {
          if (expanded) choose(active);
          return;
        }

        if (key === 'Escape' && expanded) {
          event.preventDefault();
          close();
        } else if (key === 'ArrowDown' || key === 'ArrowUp') {
          event.preventDefault();
          if (!expanded) open();
          else highlight(active + (key === 'ArrowDown' ? 1 : -1));
        } else if (key === 'Home' || key === 'End') {
          event.preventDefault();
          if (!expanded) open();
          highlight(key === 'Home' ? 0 : options.length - 1);
        } else if (key.length === 1) {
          const index = options.findIndex((option) => {
            return option.textContent.toLowerCase().startsWith(key.toLowerCase());
          });
          if (index < 0) return;

          event.preventDefault();
          if (!expanded) open();
          highlight(index);
        }
      });
      return (value) => {
        choose(options.findIndex((option) => option.dataset.value === value), false);
      };
    };

    const selectLanguage = bindSelect(languagePicker);
    bindSelect(scriptPicker);

    const normalizeWord = (word, language, composingRomaji = false) => {
      if (language !== 'ja') return word.normalize('NFC').toLowerCase();

      const normalized = word.normalize('NFKC').toLowerCase();
      const kana = wanakana.toHiragana(normalized, {
        IMEMode: composingRomaji,
        convertLongVowelMark: false,
      });

      return kana.replace(/[ァ-ヶ]/g, (letter) => {
        return String.fromCharCode(letter.charCodeAt(0) - 0x60);
      });
    };

    const printWord = (word, language, script) => {
      if (language !== 'ja') return word.toUpperCase();

      return script === 'katakana' ? wanakana.toKatakana(word) : word;
    };

    const setNotice = (message, invalid = false) => {
      notice.textContent = message;
      notice.classList.toggle('error', invalid);

      input.setAttribute('aria-invalid', String(invalid));
    };

    const promptForLetter = () => {
      const current = tileButtons[selected].textContent;
      const romaji = round.language === 'ja' ? ' ' + t('romajiHint') : '';
      setNotice(t('selectLetter', { letter: current }) + romaji);
    };

    const clearSelection = () => {
      tileButtons[selected]?.setAttribute('aria-pressed', 'false');
      selected = null;
      input.value = '';
      input.blur();
    };

    const getPlayer = () => {
      const second = history.length % 2 === 0;

      if (mode === 'bot') return t(second ? 'botName' : 'you');

      return t('player', { number: second ? 2 : 1 });
    };

    const isBotTurn = () => mode === 'bot' && history.length % 2 === 0;

    const paintBoard = (word, changed, canPlay) => {
      const printed = printWord(word, round.language, round.script);
      tiles.setAttribute('aria-label', printed);

      for (const [index, tile] of tileButtons.entries()) {
        const locked = word[index] === round.goal[index];
        const letter = printed[index];
        const glyph = tile.firstElementChild;

        if (glyph.textContent !== letter) {
          const printedGlyph = glyph.cloneNode(false);
          printedGlyph.textContent = letter;
          glyph.replaceWith(printedGlyph);
        }
        const position = t('tileLabel', { letter, number: index + 1 });
        tile.setAttribute('aria-label', locked ? t('lockedLabel', { tile: position }) : position);
        tile.classList.toggle('changed', index === changed);
        tile.classList.toggle('locked', locked);
        tile.disabled = !canPlay || locked;
      }

      input.disabled = !canPlay;
    };

    const render = () => {
      const { word, player, changed } = history.at(-1);
      const finished = word === round.goal || !nextStep;
      const botPlaying = !finished && isBotTurn();
      paintBoard(word, changed, !finished && !botPlaying);

      turn.textContent = '';
      if (word === round.goal) {
        setNotice(player === t('you') ? t('won') : t('winner', { name: player }));
      } else if (!nextStep) {
        setNotice(t('blocked'));
      } else if (botPlaying) {
        setNotice(t('botThinking'));
      } else {
        turn.textContent = mode === 'bot' ? t('yourTurn') : t('theirTurn', { name: getPlayer() });
        setNotice(t('selectPrompt'));
      }
    };

    const play = (word, changed) => {
      const move = { changed, player: getPlayer(), word };

      history.push(move);
      used.add(word);
      nextStep = word === round.goal
        ? null
        : findNextStep(word, round.goal, round.patterns, used);
      clearSelection();
      render();

      if (nextStep && isBotTurn()) {
        botTimer = setTimeout(() => {
          const current = history.at(-1).word;
          const changedByBot = [...current].findIndex((letter, index) => {
            return letter !== nextStep[index];
          });

          play(nextStep, changedByBot);
        }, 520);
      } else if (document.activeElement === document.body) {
        const previousTile = tileButtons[changed];
        const availableTile = previousTile.disabled
          ? tileButtons.find((tile) => !tile.disabled)
          : previousTile;
        const focusTarget = input.disabled ? restart : availableTile;
        focusTarget.focus();
      }
    };

    const reset = (firstStep) => {
      clearTimeout(botTimer);
      clearSelection();
      mode = document.querySelector('[name="mode"]:checked').value;
      history = [{ changed: -1, player: 'Старт', word: round.start }];
      used = new Set([round.start]);
      nextStep = firstStep;
      render();
    };

    const enterLetter = (commitRomaji = false) => {
      if (selected === null || tileButtons[selected].disabled) return;

      if (!input.value) {
        promptForLetter();
        return;
      }

      const raw = input.value.normalize('NFKC').toLowerCase();
      const letter = normalizeWord(input.value, round.language, !commitRomaji);

      // Согласная может быть только началом знака, например r → re → れ.
      if (round.language === 'ja' && !commitRomaji && letter === raw
        && /^[a-z]{1,3}$/.test(raw)) {
        const nasal = printWord('ん', round.language, round.script);
        const help = raw === 'n' ? ' ' + t('romajiNasal', { letter: nasal }) : '';
        setNotice(t('romajiProgress', { value: raw }) + help);
        return;
      }

      const current = mode === 'online' ? online.state.word : history.at(-1).word;
      const word = current.slice(0, selected) + letter + current.slice(selected + 1);
      input.value = '';

      const { letterError, pattern } = LANGUAGES[round.language];
      if (letter.length !== 1 || !pattern.test(letter)) {
        setNotice(t(letterError), true);
      } else if (letter === current[selected]) {
        setNotice(t('differentLetter'), true);
      } else if (mode === 'online') {
        sendOnlineMove(selected, letter);
      } else if (!round.words.has(word)) {
        const printed = printWord(word, round.language, round.script);
        setNotice(t('unknownQuoted', { word: printed }), true);
      } else if (used.has(word)) {
        setNotice(t('repeated_word'), true);
      } else {
        play(word, selected);
      }
    };

    tiles.addEventListener('click', (event) => {
      const tile = event.target.closest('.tile');
      const index = tileButtons.indexOf(tile);

      if (index < 0 || tile.disabled) return;

      tileButtons[selected]?.setAttribute('aria-pressed', 'false');
      selected = index;
      tile.setAttribute('aria-pressed', 'true');
      input.value = '';
      promptForLetter();
      input.focus({ preventScroll: true });
    });

    input.addEventListener('input', (event) => {
      if (!event.isComposing) enterLetter();
    });
    input.addEventListener('compositionend', () => enterLetter());
    input.addEventListener('blur', () => {
      if (selected === null) return;

      clearSelection();
      setNotice(t('selectPrompt'));
    });
    input.addEventListener('keydown', (event) => {
      if (selected === null || event.isComposing) return;

      if (event.key === 'Escape') tileButtons[selected].focus();
      if (event.key === 'Enter' && round.language === 'ja') {
        event.preventDefault();
        enterLetter(true);
      }
    });

    document.addEventListener('keydown', (event) => {
      if (game.hidden || input.disabled || event.isComposing || event.altKey || event.ctrlKey
        || event.metaKey || event.shiftKey) return;
      if (event.key !== 'ArrowLeft' && event.key !== 'ArrowRight') return;

      const focusedTile = tileButtons.indexOf(event.target);

      if (event.target !== input && event.target !== document.body && focusedTile < 0) {
        return;
      }

      event.preventDefault();
      const direction = event.key === 'ArrowRight' ? 1 : -1;
      const origin = selected ?? focusedTile;
      const start = origin < 0 && direction < 0 ? 0 : origin;
      const tileCount = tileButtons.length;

      for (let step = 1; step <= tileCount; step += 1) {
        const index = (start + direction * step + tileCount) % tileCount;

        if (!tileButtons[index].disabled) {
          tileButtons[index].click();
          return;
        }
      }
    });

    const showSetupError = (message) => {
      setupError.textContent = message;
      setupError.hidden = !message;
    };

    const applyLocale = () => {
      locale = languagePicker.value;
      document.documentElement.lang = locale;
      for (const item of document.querySelectorAll('[data-i18n]')) {
        item.textContent = t(item.dataset.i18n);
      }
      for (const item of document.querySelectorAll('[data-i18n-label]')) {
        item.setAttribute('aria-label', t(item.dataset.i18nLabel));
      }

      const script = scriptPicker.value;
      const scriptTrigger = scriptField.querySelector('[role="combobox"]');
      scriptTrigger.textContent = t(script);
      const japanese = locale === 'ja';
      const { start, goal } = LANGUAGES[locale];
      startWord.value = japanese ? printWord(start, locale, script) : start;
      goalWord.value = japanese ? printWord(goal, locale, script) : goal;
      startWord.lang = locale;
      goalWord.lang = locale;
      scriptField.hidden = !japanese;
      languageField.classList.toggle('col-span-2', !japanese);
      setupHelp.textContent = t('setupHelp') + (japanese ? ' ' + t('kanaHelp') : '');
      updateModeSettings();
      showSetupError('');
    };

    languagePicker.addEventListener('change', () => {
      applyLocale();
      try {
        localStorage.setItem('word-ladder-locale', locale);
      } catch {
        // The locale remains active for this page.
      }
    });

    scriptPicker.addEventListener('change', () => {
      for (const field of [startWord, goalWord]) {
        const word = normalizeWord(field.value.trim(), 'ja');

        if (LANGUAGES.ja.pattern.test(word)) {
          field.value = printWord(word, 'ja', scriptPicker.value);
        }
      }
    });

    const dictionaryAssets = JSON.parse(document.getElementById('dictionary-assets').textContent);
    const dictionaryCache = new Map();

    const loadDictionary = async (language, length) => {
      const embedded = document.getElementById('dictionary-' + language);
      if (embedded) return embedded.textContent;
      if (location.protocol === 'file:') throw new Error('dictionaryFile');

      const url = dictionaryAssets[language]?.[length];
      if (!url) return '';

      const cached = dictionaryCache.get(url);
      if (cached) return cached;

      const response = await fetch(url, {
        signal: AbortSignal.timeout(12000),
      });
      if (!response.ok) throw new Error('dictionaryUnavailable');

      const source = (await response.text()).trim();
      if (!source) throw new Error('dictionaryUnavailable');

      dictionaryCache.set(url, source);
      return source;
    };

    setup.addEventListener('input', () => showSetupError(''));
    setup.addEventListener('submit', async (event) => {
      event.preventDefault();
      if (setup.inert) return;

      const language = languagePicker.value;
      const script = language === 'ja' ? scriptPicker.value : '';
      const start = normalizeWord(startWord.value.trim(), language);
      const goal = normalizeWord(goalWord.value.trim(), language);
      const { pattern, wordError } = LANGUAGES[language];

      if (!pattern.test(start) || !pattern.test(goal)) {
        showSetupError(t(wordError));
        return;
      }

      if (start.length < MIN_WORD_LENGTH || goal.length < MIN_WORD_LENGTH) {
        showSetupError(t('minimum'));
        return;
      }

      if (start.length !== goal.length || start === goal) {
        showSetupError(t('sameLength'));
        return;
      }

      const config = { goal, language, script, start };
      if (document.querySelector('[name="mode"]:checked').value === 'online') {
        if (start.length > MAX_ONLINE_LENGTH) {
          showSetupError(t('tooLong', { maximum: MAX_ONLINE_LENGTH }));
          return;
        }
        createOnline(config);
        return;
      }

      let source;
      setup.inert = true;
      startButton.textContent = t('dictionaryLoading');

      try {
        source = await loadDictionary(language, start.length);
      } catch {
        source = undefined;
      } finally {
        setup.inert = false;
        startButton.textContent = t('start');
      }

      if (source === undefined) {
        showSetupError(t(location.protocol === 'file:' ? 'dictionaryFile' : 'dictionaryUnavailable'));
        startButton.focus();
        return;
      }

      const words = new Set(source.trim().split(/\s+/).filter((word) => {
        return word.length === start.length;
      }));
      words.add(start);
      words.add(goal);
      const patterns = buildPatterns(words);
      const firstStep = findNextStep(start, goal, patterns, []);

      if (!firstStep) {
        showSetupError(t('no_path'));
        return;
      }

      showBoard({ ...config, patterns, words });
      reset(firstStep);
      tiles.querySelector(':enabled')?.focus();
    });

    const showBoard = (config) => {
      round = config;
      const { goal, language, script } = config;
      tileButtons = [];
      const printedGoal = printWord(goal, language, script);
      const targetTiles = [...printedGoal].map((goalGlyph) => {
        const tile = document.createElement('button');
        const glyph = document.createElement('span');
        const targetTile = document.createElement('div');
        glyph.lang = language;
        tile.className = 'tile';
        tile.type = 'button';
        tile.setAttribute('aria-pressed', 'false');
        tile.append(glyph);
        const targetGlyph = glyph.cloneNode(false);
        targetGlyph.textContent = goalGlyph;
        targetTile.className = 'tile target-glyph';
        targetTile.setAttribute('aria-hidden', 'true');
        targetTile.append(targetGlyph);
        tileButtons.push(tile);
        return targetTile;
      });
      tiles.replaceChildren(...tileButtons);
      target.replaceChildren(...targetTiles);
      game.style.setProperty('--letters', printedGoal.length);
      target.lang = language;
      target.setAttribute('aria-label', printedGoal);
      setup.hidden = true;
      game.hidden = false;
    };

    const hostName = document.getElementById('host-name');
    const hostNameField = document.getElementById('host-name-field');
    const startButton = document.getElementById('start-button');
    const joinForm = document.getElementById('join-form');
    const joinError = document.getElementById('join-error');
    const guestName = document.getElementById('guest-name');
    const joinButton = document.getElementById('join-button');
    const joinBack = document.getElementById('join-back');
    const unavailableGame = document.getElementById('unavailable-game');
    const unavailableHeading = document.getElementById('unavailable-heading');
    const unavailableBack = document.getElementById('unavailable-back');
    const onlineTurn = document.getElementById('online-turn');
    const invitePanel = document.getElementById('invite-panel');
    const inviteLink = document.getElementById('invite-link');
    const copyInvite = document.getElementById('copy-invite');

    let online = null;
    let pendingCreate;
    let guestToken;
    let inviteId = new URL(location.href).searchParams.get('game');

    const setInvite = (id) => {
      const url = new URL(location.href);
      if (id) url.searchParams.set('game', id);
      else url.searchParams.delete('game');
      historyReplace(url);
      inviteId = id;
    };

    const historyReplace = (url) => {
      try {
        window.history.replaceState(null, '', url);
      } catch {
        // Some browsers restrict URL changes when opening the standalone file.
      }
    };

    const serverUrl = (id, socket = false) => {
      const configured = document.querySelector('[name="word-ladder-server"]').content.trim();
      const local = ['localhost', '127.0.0.1'].includes(location.hostname);
      if (!configured && !local) throw new Error('unconfigured');

      const url = new URL(configured || 'http://127.0.0.1:8787');
      if (!['http:', 'https:'].includes(url.protocol)
        || (location.protocol === 'https:' && url.protocol !== 'https:')) {
        throw new Error('unconfigured');
      }
      const prefix = url.pathname.replace(/\/+$/, '');
      url.pathname = prefix + '/games/' + id + (socket ? '/socket' : '');
      url.search = '';
      url.hash = '';
      if (socket) url.protocol = url.protocol === 'https:' ? 'wss:' : 'ws:';
      return url;
    };

    const roomRequest = async (id, payload) => {
      let url;
      try {
        url = serverUrl(id);
      } catch {
        throw new Error('unconfigured');
      }

      let response;
      try {
        response = await fetch(url, {
          body: JSON.stringify(payload),
          headers: { 'Content-Type': 'application/json' },
          method: 'POST',
          signal: AbortSignal.timeout(8000),
        });
      } catch {
        throw new Error('offline');
      }
      const data = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(data.error ?? 'offline');
      return data;
    };

    const seatStorage = (id, token) => {
      const key = 'word-ladder-seat:' + id;
      let persisted = false;
      try {
        if (token === undefined) {
          const savedSeat = localStorage.getItem(key);
          if (savedSeat) return savedSeat;
        } else if (token) {
          localStorage.setItem(key, token);
          persisted = true;
        } else localStorage.removeItem(key);
      } catch {
        // Use tab storage when persistent storage is unavailable.
      }
      try {
        if (token === undefined) return sessionStorage.getItem(key);
        if (token && !persisted) sessionStorage.setItem(key, token);
        else sessionStorage.removeItem(key);
      } catch {
        // Reconnection within this tab still works while it stays open.
      }
      return null;
    };

    const validName = (name) => name.length > 0 && name.length <= MAX_NAME_LENGTH
      && !/[\x00-\x1f\x7f]/.test(name);

    const renderOnline = () => {
      const { connected, error, leaving, pending, seat, state } = online;
      const ownTurn = connected && !leaving && !pending
        && state.phase === 'playing' && state.turn === seat;
      const { players, winner } = state;
      let status;
      if (error) status = t(error);
      else if (state.phase === 'finished') {
        status = winner === seat ? t('won') : t('winner', { name: players[winner] });
      } else if (state.phase === 'blocked') status = t('blocked');
      else if (!connected) status = t(online.socket ? 'reconnecting' : 'loading');
      else if (state.phase === 'waiting') status = t('waiting');
      else if (pending) status = t('sending');
      else status = ownTurn ? t('yourTurn') : t('theirTurn', { name: players[state.turn] });

      turn.textContent = '';
      onlineTurn.hidden = false;
      onlineTurn.textContent = status;
      onlineTurn.dataset.ownTurn = String(ownTurn);
      invitePanel.hidden = seat !== 0 || state.phase !== 'waiting' || !!error;
      restart.textContent = t(!error && seat === 1 && state.phase === 'playing'
        ? 'leaveGame' : 'newGame');
      restart.disabled = !!leaving;
      paintBoard(state.word, state.changed, ownTurn);
      setNotice(ownTurn ? t('selectPrompt') : '');
    };

    const reopenOnline = (session) => {
      const retry = async () => {
        if (online !== session) return;

        try {
          const data = await roomRequest(session.id, { action: 'resume', token: session.token });
          if (online !== session) return;
          session.state = data.state;
          openSocket(session);
        } catch (error) {
          if (online !== session) return;
          if (error.message === 'not_found') {
            showUnavailable();
            return;
          }
          if (['invalid_seat', 'unconfigured'].includes(error.message)) {
            session.error = error.message;
            renderOnline();
            return;
          }
          reopenOnline(session);
        }
      };
      session.retry = setTimeout(retry, session.delay);
      session.delay = Math.min(session.delay * 2, 5000);
    };

    const openSocket = (session) => {
      const socket = new WebSocket(serverUrl(session.id, true), [
        WS_PROTOCOL, 'seat.' + session.token,
      ]);
      session.socket = socket;

      socket.addEventListener('message', (event) => {
        if (online !== session || session.socket !== socket) return;
        const message = JSON.parse(event.data);
        session.connected = true;
        session.pending = false;
        session.delay = 500;
        if (message.state && message.state.revision >= session.state.revision) {
          clearSelection();
          session.state = message.state;
        }
        renderOnline();
        if (message.type === 'error') setNotice(t(message.code), true);
      });
      socket.addEventListener('close', ({ code }) => {
        if (online !== session || session.socket !== socket) return;
        if (code === 4002 || (code === 4001 && session.leaving)) {
          seatStorage(session.id, null);
          leaveGame();
          return;
        }
        if (code === 4001) {
          showUnavailable();
          return;
        }
        session.connected = false;
        session.pending = false;
        clearSelection();
        renderOnline();
        if (!session.error) reopenOnline(session);
      });
    };

    const enterOnline = (id, token, { seat, state }) => {
      seatStorage(id, token);
      setInvite(id);
      online = { connected: false, delay: 500, id, pending: false, seat, state, token };
      mode = 'online';
      joinForm.hidden = true;
      showBoard(state.config);
      const url = new URL(location.href);
      url.searchParams.set('game', id);
      inviteLink.value = url.href;
      renderOnline();
      openSocket(online);
    };

    const createOnline = async (config) => {
      const name = hostName.value.trim();
      if (!validName(name)) {
        showSetupError(t('invalid_name'));
        hostName.focus();
        return;
      }

      setup.inert = true;
      startButton.textContent = t('loading');
      try {
        const fingerprint = JSON.stringify({ config, name });
        if (pendingCreate?.fingerprint !== fingerprint) {
          pendingCreate = { fingerprint, id: crypto.randomUUID(), token: crypto.randomUUID() };
        }
        const { id, token } = pendingCreate;
        const result = await roomRequest(id, { action: 'create', config, name, token });
        enterOnline(id, token, result);
        pendingCreate = null;
      } catch (error) {
        showSetupError(t(error.message));
      } finally {
        setup.inert = false;
        startButton.textContent = t('create');
      }
    };

    const showJoinError = (code) => {
      joinError.textContent = code ? t(code) : '';
      joinError.hidden = !code;
    };

    const submitJoin = async (id, payload) => {
      joinButton.disabled = true;
      joinButton.textContent = t('loading');
      showJoinError('');
      try {
        const result = await roomRequest(id, payload);
        if (inviteId !== id) return;
        enterOnline(id, payload.token, result);
      } catch (error) {
        if (inviteId !== id) return;
        if (error.message === 'not_found') {
          showUnavailable();
          return;
        }
        joinForm.hidden = false;
        if (payload.action === 'resume' && error.message === 'invalid_seat') {
          seatStorage(id, null);
          guestToken = null;
        }
        showJoinError(error.message);
      } finally {
        joinButton.disabled = false;
        joinButton.textContent = t('join');
      }
    };

    const initializeInvite = async () => {
      if (inviteId === null) return;
      setup.hidden = true;
      if (!GAME_UUID.test(inviteId)) {
        joinForm.hidden = false;
        showJoinError('invalidLink');
        joinButton.disabled = true;
        return;
      }

      inviteId = inviteId.toLowerCase();
      const id = inviteId;
      const token = seatStorage(id);
      if (token) {
        submitJoin(id, { action: 'resume', token });
        return;
      }

      try {
        await roomRequest(id, { action: 'status' });
      } catch (error) {
        if (inviteId !== id) return;
        if (error.message === 'not_found') {
          showUnavailable();
          return;
        }
        showJoinError(error.message);
      }

      if (inviteId !== id) return;
      joinForm.hidden = false;
      guestName.focus();
    };

    const leaveGame = (keepInvite = false) => {
      const session = online;
      online = null;
      if (session) {
        clearTimeout(session.retry);
        session.socket?.close();
      }
      clearTimeout(botTimer);
      clearSelection();
      if (!keepInvite && inviteId !== null) setInvite(null);
      guestToken = null;
      onlineTurn.hidden = true;
      invitePanel.hidden = true;
      restart.disabled = false;
      restart.textContent = t('newGame');
      game.hidden = true;
      joinForm.hidden = true;
      unavailableGame.hidden = !keepInvite;
      setup.hidden = keepInvite;
      if (keepInvite) unavailableHeading.focus();
      else startWord.focus();
    };

    const showUnavailable = () => {
      seatStorage(inviteId, null);
      leaveGame(true);
    };

    const leaveOnline = async (session) => {
      session.leaving = true;
      clearSelection();
      renderOnline();

      try {
        const action = session.seat === 0 ? 'end' : 'leave';
        await roomRequest(session.id, { action, token: session.token });
      } catch (error) {
        if (online !== session) return;
        if (error.message !== 'invalid_seat' && error.message !== 'not_found') {
          session.leaving = false;
          renderOnline();
          setNotice(t(error.message), true);
          return;
        }
      }

      if (online !== session) return;
      seatStorage(session.id, null);
      leaveGame();
    };

    const sendOnlineMove = (position, letter) => {
      if (!online.connected || online.socket.readyState !== WebSocket.OPEN) return;

      online.socket.send(JSON.stringify({
        letter, position, revision: online.state.revision, type: 'move',
      }));
      online.pending = true;
      clearSelection();
      renderOnline();
    };

    const updateModeSettings = () => {
      const onlineMode = document.querySelector('[name="mode"]:checked').value === 'online';
      hostNameField.hidden = !onlineMode;
      startButton.textContent = t(onlineMode ? 'create' : 'start');
    };

    for (const choice of document.querySelectorAll('[name="mode"]')) {
      choice.addEventListener('change', () => {
        updateModeSettings();
        showSetupError('');
      });
    }

    joinForm.addEventListener('submit', (event) => {
      event.preventDefault();
      if (!inviteId || !GAME_UUID.test(inviteId) || joinButton.disabled) return;
      const name = guestName.value.trim();
      if (!validName(name)) {
        showJoinError('invalid_name');
        guestName.focus();
        return;
      }
      try {
        guestToken ??= seatStorage(inviteId) ?? crypto.randomUUID();
        submitJoin(inviteId, { action: 'join', name, token: guestToken });
      } catch {
        showJoinError('offline');
      }
    });
    guestName.addEventListener('input', () => showJoinError(''));
    joinBack.addEventListener('click', () => leaveGame());
    unavailableBack.addEventListener('click', () => leaveGame());
    restart.addEventListener('click', () => {
      if (online && !online.error && (online.seat === 0 || online.state.phase === 'playing')) {
        if (!online.leaving) leaveOnline(online);
      } else {
        leaveGame();
      }
    });

    copyInvite.addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(inviteLink.value);
        setNotice(t('copied'));
      } catch {
        inviteLink.select();
        setNotice(t('copyFailed'));
      }
    });

    try {
      const savedLocale = localStorage.getItem('word-ladder-locale');
      if (savedLocale && Object.hasOwn(STRINGS, savedLocale)) locale = savedLocale;
    } catch {
      // Fall back to browser preferences when storage is unavailable.
    }
    if (languagePicker.value !== locale) selectLanguage(locale);
    applyLocale();
    initializeInvite();
  </script>
</body>
</html>
